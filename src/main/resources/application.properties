spring.application.name=socialMeli

# MySQL Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/socialmeli?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update